<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Trading – Little Heartworks</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { min-height:100vh; background:#fff9f0; font-family:'Nunito',sans-serif; padding-bottom:90px; }
    header {
      background:linear-gradient(135deg,#a29bfe,#ff9ff3);
      padding:14px 20px; display:flex; align-items:center; gap:10px;
      box-shadow:0 4px 20px rgba(162,155,254,0.3); position:sticky; top:0; z-index:40;
    }
    .logo { font-family:'Fredoka One',cursive; font-size:1.2rem; color:white; flex:1; }
    .nav-btn {
      background:white; border:none; border-radius:50px; padding:8px 16px;
      font-family:'Fredoka One',cursive; font-size:0.85rem; cursor:pointer;
      color:#a29bfe; text-decoration:none; flex-shrink:0;
    }
    .nav-btn-ghost {
      background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.5);
      border-radius:50px; padding:7px 14px; font-family:'Fredoka One',cursive;
      font-size:0.82rem; color:white; cursor:pointer; text-decoration:none; flex-shrink:0;
    }
    .container { max-width:760px; margin:0 auto; padding:22px 16px 20px; }
    .search-row { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
    .search-input {
      flex:1; min-width:160px; padding:10px 16px; border:2px solid #eee; border-radius:50px;
      font-family:'Nunito',sans-serif; font-size:0.92rem; outline:none;
      background:white;
    }
    .search-input:focus { border-color:#a29bfe; }
    .post-btn {
      background:linear-gradient(135deg,#ff6b6b,#feca57); border:none; border-radius:50px;
      padding:10px 20px; font-family:'Fredoka One',cursive; font-size:0.88rem;
      color:white; cursor:pointer; text-decoration:none; white-space:nowrap;
    }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
    .card {
      background:white; border-radius:18px; overflow:hidden;
      box-shadow:0 4px 14px rgba(162,155,254,0.15); cursor:pointer;
      transition:transform 0.15s; border:2px solid transparent;
    }
    .card:hover { transform:translateY(-3px); border-color:#a29bfe; }
    .card-img { width:100%; aspect-ratio:1; object-fit:cover; background:#f4f0ff; display:flex; align-items:center; justify-content:center; font-size:2.5rem; }
    .card-img img { width:100%; height:100%; object-fit:cover; }
    .card-body { padding:12px; }
    .card-name { font-family:'Fredoka One',cursive; font-size:0.92rem; color:#333; margin-bottom:3px; }
    .card-by { font-size:0.75rem; color:#aaa; margin-bottom:5px; }
    .card-price { font-family:'Fredoka One',cursive; font-size:0.85rem; color:#a29bfe; }
    .empty { text-align:center; padding:50px 20px; color:#ccc; font-family:'Fredoka One',cursive; }

    /* Offer modal - slides up from bottom on mobile */
    .modal-bg {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4);
      z-index:200; align-items:flex-end; justify-content:center;
    }
    .modal-bg.open { display:flex; }
    @media(min-width:600px){ .modal-bg { align-items:center; } }
    .modal {
      background:white; border-radius:24px 24px 0 0; padding:24px 20px 32px; width:100%; max-width:480px;
    }
    @media(min-width:600px){ .modal { border-radius:24px; padding:28px; } }
    .modal-title { font-family:'Fredoka One',cursive; font-size:1.1rem; color:#333; margin-bottom:14px; }
    .modal-preview { display:flex; align-items:center; gap:12px; background:#f4f0ff; border-radius:14px; padding:12px; margin-bottom:16px; }
    .modal-thumb { width:48px; height:48px; border-radius:10px; object-fit:cover; background:#e0d8ff; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1.3rem; overflow:hidden; }
    .modal-thumb img { width:100%; height:100%; object-fit:cover; }
    .modal-card-info .name { font-family:'Fredoka One',cursive; font-size:0.95rem; color:#333; }
    .modal-card-info .min { font-size:0.78rem; color:#a29bfe; margin-top:2px; }
    label { display:block; font-weight:700; font-size:0.82rem; color:#555; margin-bottom:4px; }
    .field { margin-bottom:12px; }
    .field input {
      width:100%; padding:10px 14px; border:2px solid #eee; border-radius:12px;
      font-family:'Nunito',sans-serif; font-size:0.9rem; outline:none;
    }
    .field input:focus { border-color:#a29bfe; }
    .modal-actions { display:flex; gap:10px; margin-top:4px; }
    .cancel-btn { flex:1; background:#f0f0f0; border:none; border-radius:50px; padding:11px; font-family:'Fredoka One',cursive; font-size:0.88rem; color:#999; cursor:pointer; }
    .send-btn { flex:2; background:linear-gradient(135deg,#a29bfe,#ff9ff3); border:none; border-radius:50px; padding:11px; font-family:'Fredoka One',cursive; font-size:0.88rem; color:white; cursor:pointer; }
    .modal-msg { margin-top:8px; font-size:0.82rem; text-align:center; color:#aaa; }

    /* Bottom nav */
    .bottom-nav {
      position:fixed; bottom:0; left:0; right:0; background:white;
      border-top:2px solid #eee; padding:10px 12px 14px;
      display:flex; gap:6px; justify-content:center; z-index:200;
    }
    .bnav-btn {
      flex:1; min-width:60px; max-width:120px; background:#f4f0ff; border:none;
      border-radius:14px; padding:9px 6px; font-family:'Fredoka One',cursive;
      font-size:0.72rem; color:#a29bfe; cursor:pointer; text-decoration:none;
      text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px;
    }
    .bnav-btn.active { background:linear-gradient(135deg,#a29bfe,#ff9ff3); color:white; }
    .bnav-btn.post  { background:linear-gradient(135deg,#ff6b6b,#feca57); color:white; }
    .bnav-icon { font-size:1.2rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">🃏 Card Trading</div>
    <a href="platform-kid-dashboard.html" class="nav-btn-ghost">← Home</a>
  </header>

  <div class="container">
    <div class="search-row">
      <input class="search-input" type="text" id="searchInput" placeholder="Search cards..." oninput="renderGrid()" />
      <a href="platform-kid-trade-my-posts.html" class="post-btn">+ Post Card</a>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="emptyState" style="display:none;">No cards listed yet — be the first to post one!</p>
  </div>

  <div class="bottom-nav">
    <a href="platform-kid-trade-center.html" class="bnav-btn active">
      <span class="bnav-icon">🃏</span>Browse
    </a>
    <a href="platform-kid-trade-my-posts.html" class="bnav-btn post">
      <span class="bnav-icon">➕</span>Post Card
    </a>
    <a href="platform-kid-trade-offers.html" class="bnav-btn">
      <span class="bnav-icon">📬</span>My Offers
    </a>
    <a href="platform-kid-shop.html" class="bnav-btn">
      <span class="bnav-icon">🛍️</span>Shop
    </a>
    <a href="platform-kid-dashboard.html" class="bnav-btn">
      <span class="bnav-icon">🏠</span>Home
    </a>
  </div>

  <!-- Offer modal -->
  <div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <p class="modal-title">Make an Offer</p>
      <div class="modal-preview">
        <div class="modal-thumb" id="modalThumb">🃏</div>
        <div class="modal-card-info">
          <p class="name" id="modalCardName"></p>
          <p class="min" id="modalCardMin"></p>
        </div>
      </div>
      <div class="field">
        <label>Money offer ($) <span style="font-weight:400;color:#aaa;">(optional)</span></label>
        <input type="number" id="offerMoney" min="0" step="0.01" placeholder="0.00" />
      </div>
      <div class="field">
        <label>Cards to offer <span style="font-weight:400;color:#aaa;">(optional)</span></label>
        <input type="text" id="offerCards" placeholder="e.g. two holos, Pikachu..." />
      </div>
      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="send-btn" onclick="sendOffer()">Send Offer ✨</button>
      </div>
      <p class="modal-msg" id="modalMsg"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://iwmviwhruzhwkokcjcnu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3bXZpd2hydXpod2tva2NqY251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTE1MzYsImV4cCI6MjA5NjMyNzUzNn0.MtHOeTGyW5Q68HfYSJW7keNJGHpO5GCwJ2735ij_-JA';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;
    let allListings = [];
    let selectedListing = null;

    async function init() {
      const raw = localStorage.getItem('kidSession');
      if (raw) {
        currentUser = JSON.parse(raw);
        loadListings();
        return;
      }
      try {
        const { data } = await sb.auth.getSession();
        if (data?.session) {
          const m = data.session.user.user_metadata || {};
          currentUser = { kid_id: data.session.user.id, kid_name: m.full_name || data.session.user.email };
          loadListings(); return;
        }
      } catch(e) {}
      try {
        const { data } = await sb.auth.getUser();
        if (data?.user) {
          const m = data.user.user_metadata || {};
          currentUser = { kid_id: data.user.id, kid_name: m.full_name || data.user.email };
          loadListings(); return;
        }
      } catch(e) {}
      window.location.href = 'platform-index.html';
    }

    async function loadListings() {
      const { data, error } = await sb.from('card_listings').select('*').eq('status','active').order('created_at',{ascending:false});
      allListings = (error ? [] : data) || [];
      renderGrid();
    }

    function renderGrid() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allListings.filter(l =>
        !q || l.card_name.toLowerCase().includes(q) || (l.description||'').toLowerCase().includes(q)
      );
      const grid = document.getElementById('grid');
      const empty = document.getElementById('emptyState');
      if (!filtered.length) { grid.innerHTML=''; empty.style.display='block'; return; }
      empty.style.display='none';
      grid.innerHTML = filtered.map(l => {
        const img = l.card_image_url
          ? `<div class="card-img"><img src="${esc(l.card_image_url)}" /></div>`
          : `<div class="card-img">🃏</div>`;
        const preferred = l.preferred_trade ? esc(l.preferred_trade) : 'Any offer';
        return `<div class="card" onclick='openModal(${JSON.stringify(l)})'>
          ${img}
          <div class="card-body">
            <p class="card-name">${esc(l.card_name)}</p>
            <p class="card-by">by ${esc(l.poster_name||'Anonymous')}</p>
            <p class="card-price">${preferred}</p>
          </div>
        </div>`;
      }).join('');
    }

    function openModal(listing) {
      selectedListing = listing;
      const thumb = document.getElementById('modalThumb');
      thumb.innerHTML = listing.card_image_url ? `<img src="${esc(listing.card_image_url)}" />` : '🃏';
      document.getElementById('modalCardName').textContent = listing.card_name;
      document.getElementById('modalCardMin').textContent = listing.preferred_trade ? `Wants: ${listing.preferred_trade}` : 'Any offer OK';
      document.getElementById('offerMoney').value='';
      document.getElementById('offerCards').value='';
      document.getElementById('modalMsg').textContent='';
      document.getElementById('modalBg').classList.add('open');
    }

    function closeModal() { document.getElementById('modalBg').classList.remove('open'); }

    async function sendOffer() {
      if (!selectedListing || !currentUser) return;
      const money = parseFloat(document.getElementById('offerMoney').value) || null;
      const cards = document.getElementById('offerCards').value.trim() || null;
      if (!money && !cards) { document.getElementById('modalMsg').textContent='Add money or cards to offer.'; return; }
      const btn = document.querySelector('.send-btn');
      btn.disabled=true; btn.textContent='Sending...';
      const { error } = await sb.from('card_offers').insert({
        listing_id: selectedListing.id,
        offerer_user_id: currentUser.kid_id,
        offerer_name: currentUser.kid_name,
        offer_money: money,
        offer_cards: cards,
        status: 'pending'
      });
      btn.disabled=false; btn.textContent='Send Offer ✨';
      const msg = document.getElementById('modalMsg');
      if (error) { msg.style.color='#c0392b'; msg.textContent=error.message; return; }
      msg.style.color='#27ae60'; msg.textContent='✅ Offer sent!';
      setTimeout(closeModal, 1200);
    }

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    init();
  </script>
</body>
</html>
