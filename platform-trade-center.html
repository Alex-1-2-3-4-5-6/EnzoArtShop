<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Trading – Little Heartworks</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { min-height:100vh; background:#f4f6ff; font-family:'Nunito',sans-serif; }
    header {
      background:white; padding:14px 28px; display:flex; align-items:center; gap:12px;
      box-shadow:0 2px 12px rgba(0,0,0,0.07); position:sticky; top:0; z-index:40;
    }
    .logo { font-family:'Fredoka One',cursive; font-size:1.3rem; color:#ff6b6b; flex:1; }
    .logo span { color:#a29bfe; }
    .hbtn {
      background:white; border:2px solid #eee; border-radius:50px; padding:8px 18px;
      font-family:'Fredoka One',cursive; font-size:0.88rem; cursor:pointer;
      color:#555; text-decoration:none; white-space:nowrap;
    }
    .hbtn-primary { background:linear-gradient(135deg,#a29bfe,#ff9ff3); border-color:transparent; color:white; }
    .container { max-width:900px; margin:0 auto; padding:28px 20px 100px; }
    .page-title { font-family:'Fredoka One',cursive; font-size:1.8rem; color:#333; margin-bottom:6px; }
    .page-sub { color:#aaa; font-size:0.9rem; margin-bottom:24px; }
    .search-row { display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap; }
    .search-input {
      flex:1; min-width:200px; padding:11px 16px; border:2px solid #eee; border-radius:50px;
      font-family:'Nunito',sans-serif; font-size:0.95rem; outline:none;
    }
    .search-input:focus { border-color:#a29bfe; }
    .post-btn {
      background:linear-gradient(135deg,#ff6b6b,#feca57); border:none; border-radius:50px;
      padding:11px 22px; font-family:'Fredoka One',cursive; font-size:0.9rem;
      color:white; cursor:pointer; text-decoration:none; white-space:nowrap;
    }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
    .card {
      background:white; border-radius:18px; overflow:hidden;
      box-shadow:0 4px 14px rgba(0,0,0,0.07); cursor:pointer;
      transition:transform 0.15s; border:2px solid transparent;
    }
    .card:hover { transform:translateY(-3px); border-color:#a29bfe; }
    .card-img { width:100%; aspect-ratio:1; object-fit:cover; background:#f4f0ff; display:flex; align-items:center; justify-content:center; font-size:3rem; }
    .card-img img { width:100%; height:100%; object-fit:cover; }
    .card-body { padding:14px; }
    .card-name { font-family:'Fredoka One',cursive; font-size:1rem; color:#333; margin-bottom:4px; }
    .card-by { font-size:0.78rem; color:#aaa; margin-bottom:6px; }
    .card-price { font-family:'Fredoka One',cursive; font-size:0.9rem; color:#a29bfe; }
    .empty { text-align:center; padding:60px 20px; color:#ccc; font-family:'Fredoka One',cursive; }

    /* Offer modal */
    .modal-bg {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4);
      z-index:200; align-items:center; justify-content:center; padding:20px;
    }
    .modal-bg.open { display:flex; }
    .modal {
      background:white; border-radius:24px; padding:28px; max-width:480px; width:100%;
      max-height:90vh; overflow-y:auto;
    }
    .modal-title { font-family:'Fredoka One',cursive; font-size:1.2rem; color:#333; margin-bottom:16px; }
    .modal-card-preview { display:flex; align-items:center; gap:12px; background:#f4f0ff; border-radius:14px; padding:12px 16px; margin-bottom:18px; }
    .modal-card-thumb { width:52px; height:52px; border-radius:10px; object-fit:cover; background:#e0d8ff; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1.4rem; overflow:hidden; }
    .modal-card-thumb img { width:100%; height:100%; object-fit:cover; }
    .modal-card-info .name { font-family:'Fredoka One',cursive; font-size:1rem; color:#333; }
    .modal-card-info .min { font-size:0.8rem; color:#a29bfe; margin-top:2px; }
    label { display:block; font-weight:700; font-size:0.85rem; color:#555; margin-bottom:5px; }
    .field { margin-bottom:14px; }
    .field input, .field textarea {
      width:100%; padding:10px 14px; border:2px solid #eee; border-radius:12px;
      font-family:'Nunito',sans-serif; font-size:0.92rem; outline:none; resize:vertical;
    }
    .field input:focus, .field textarea:focus { border-color:#a29bfe; }
    .modal-actions { display:flex; gap:10px; margin-top:4px; }
    .cancel-btn { flex:1; background:#f0f0f0; border:none; border-radius:50px; padding:11px; font-family:'Fredoka One',cursive; font-size:0.9rem; color:#999; cursor:pointer; }
    .send-btn { flex:2; background:linear-gradient(135deg,#a29bfe,#ff9ff3); border:none; border-radius:50px; padding:11px; font-family:'Fredoka One',cursive; font-size:0.9rem; color:white; cursor:pointer; }
    .modal-msg { margin-top:10px; font-size:0.85rem; text-align:center; color:#aaa; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Little <span>Heart</span>works</div>
    <a href="platform-shop.html" class="hbtn">← Shop</a>
    <a href="platform-trade-my-posts.html" class="hbtn">📋 My Posts</a>
    <a href="platform-my-trades.html" class="hbtn">📬 My Offers</a>
  </header>

  <div class="container">
    <p class="page-title">🃏 Card Trading Center</p>
    <p class="page-sub">Browse cards listed for trade and make an offer!</p>

    <div class="search-row">
      <input class="search-input" type="text" id="searchInput" placeholder="Search cards..." oninput="renderGrid()" />
      <a href="platform-trade-my-posts.html" class="post-btn">+ Post a Card</a>
    </div>

    <div class="grid" id="grid"></div>
    <p class="empty" id="emptyState" style="display:none;">No cards listed yet.</p>
  </div>

  <!-- Offer modal -->
  <div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <p class="modal-title">Make an Offer</p>
      <div class="modal-card-preview">
        <div class="modal-card-thumb" id="modalThumb">🃏</div>
        <div class="modal-card-info">
          <p class="name" id="modalCardName"></p>
          <p class="min" id="modalCardMin"></p>
        </div>
      </div>
      <div class="field">
        <label>Money offer ($) <span style="font-weight:400;color:#aaa;">(optional)</span></label>
        <input type="number" id="offerMoney" min="0" step="0.01" placeholder="0.00" />
      </div>
      <div class="field">
        <label>Cards to offer <span style="font-weight:400;color:#aaa;">(optional)</span></label>
        <input type="text" id="offerCards" placeholder="e.g. Charizard, two holos..." />
      </div>
      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="send-btn" onclick="sendOffer()">Send Offer ✨</button>
      </div>
      <p class="modal-msg" id="modalMsg"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://iwmviwhruzhwkokcjcnu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3bXZpd2hydXpod2tva2NqY251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTE1MzYsImV4cCI6MjA5NjMyNzUzNn0.MtHOeTGyW5Q68HfYSJW7keNJGHpO5GCwJ2735ij_-JA';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;
    let allListings = [];
    let selectedListing = null;

    async function init() {
      const { data: { user } } = await sb.auth.getUser();
      currentUser = user || null;
      loadListings();
    }

    async function loadListings() {
      const { data, error } = await sb.from('card_listings').select('*').eq('status','active').order('created_at',{ascending:false});
      allListings = (error ? [] : data) || [];
      renderGrid();
    }

    function renderGrid() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allListings.filter(l =>
        !q || l.card_name.toLowerCase().includes(q) || (l.description||'').toLowerCase().includes(q)
      );
      const grid = document.getElementById('grid');
      const empty = document.getElementById('emptyState');
      if (!filtered.length) { grid.innerHTML=''; empty.style.display='block'; return; }
      empty.style.display='none';
      grid.innerHTML = filtered.map(l => {
        const img = l.card_image_url
          ? `<div class="card-img"><img src="${esc(l.card_image_url)}" /></div>`
          : `<div class="card-img">🃏</div>`;
        const preferred = l.preferred_trade ? esc(l.preferred_trade) : 'Any offer';
        return `<div class="card" onclick="openModal(${JSON.stringify(l).replace(/"/g,'&quot;')})">
          ${img}
          <div class="card-body">
            <p class="card-name">${esc(l.card_name)}</p>
            <p class="card-by">by ${esc(l.poster_name||'Anonymous')}</p>
            <p class="card-price">${preferred}</p>
          </div>
        </div>`;
      }).join('');
    }

    function openModal(listing) {
      selectedListing = listing;
      const thumb = document.getElementById('modalThumb');
      thumb.innerHTML = listing.card_image_url ? `<img src="${esc(listing.card_image_url)}" />` : '🃏';
      document.getElementById('modalCardName').textContent = listing.card_name;
      document.getElementById('modalCardMin').textContent = listing.preferred_trade ? `Wants: ${listing.preferred_trade}` : 'Any offer OK';
      document.getElementById('offerMoney').value = '';
      document.getElementById('offerCards').value = '';
      document.getElementById('modalMsg').textContent = '';
      document.getElementById('modalBg').classList.add('open');
    }

    function closeModal() { document.getElementById('modalBg').classList.remove('open'); }

    async function sendOffer() {
      if (!selectedListing) return;
      if (!currentUser) { document.getElementById('modalMsg').textContent = 'Sign in to send offers.'; return; }
      const money = parseFloat(document.getElementById('offerMoney').value) || null;
      const cards = document.getElementById('offerCards').value.trim() || null;
      if (!money && !cards) { document.getElementById('modalMsg').textContent = 'Add money or cards to offer.'; return; }
      const btn = document.querySelector('.send-btn');
      btn.disabled = true; btn.textContent = 'Sending...';
      const meta = currentUser.user_metadata || {};
      const { error } = await sb.from('card_offers').insert({
        listing_id: selectedListing.id,
        offerer_user_id: currentUser.id,
        offerer_name: meta.full_name || currentUser.email,
        offer_money: money,
        offer_cards: cards,
        status: 'pending'
      });
      btn.disabled = false; btn.textContent = 'Send Offer ✨';
      const msg = document.getElementById('modalMsg');
      if (error) { msg.style.color='#c0392b'; msg.textContent = error.message; return; }
      msg.style.color='#27ae60'; msg.textContent = '✅ Offer sent!';
      setTimeout(closeModal, 1200);
    }

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    init();
  </script>
</body>
</html>
