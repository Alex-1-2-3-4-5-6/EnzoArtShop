<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Offers – Little Heartworks</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { min-height:100vh; background:#fff9f0; font-family:'Nunito',sans-serif; padding-bottom:90px; }

    header {
      background:linear-gradient(135deg,#a29bfe,#ff9ff3);
      padding:14px 20px; display:flex; align-items:center; gap:10px;
      box-shadow:0 4px 20px rgba(162,155,254,0.3); position:sticky; top:0; z-index:40;
    }
    .logo { font-family:'Fredoka One',cursive; font-size:1.2rem; color:white; flex:1; }
    .nav-btn {
      background:white; border:none; border-radius:50px; padding:8px 16px;
      font-family:'Fredoka One',cursive; font-size:0.85rem; cursor:pointer;
      color:#a29bfe; text-decoration:none; flex-shrink:0;
    }
    .nav-btn-ghost {
      background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.5);
      border-radius:50px; padding:7px 14px; font-family:'Fredoka One',cursive;
      font-size:0.82rem; color:white; cursor:pointer; text-decoration:none; flex-shrink:0;
    }

    .container { max-width:760px; margin:0 auto; padding:22px 16px 20px; }
    .section-title { font-family:'Fredoka One',cursive; font-size:1rem; color:#a29bfe; margin:20px 0 10px; }

    /* Meet-up banner */
    .meetup-banner {
      background:linear-gradient(135deg,#d4edda,#c3f0ca); border-radius:18px;
      padding:18px 20px; display:flex; align-items:center; gap:12px;
      border:2px solid #a8e6cf; margin-bottom:12px;
    }
    .meetup-banner .icon { font-size:2.2rem; flex-shrink:0; }
    .meetup-banner h3 { font-family:'Fredoka One',cursive; font-size:1.05rem; color:#155724; }
    .meetup-banner p  { font-size:0.8rem; color:#27ae60; margin-top:3px; }

    .offer-card {
      background:white; border-radius:18px; padding:16px 18px;
      box-shadow:0 4px 14px rgba(0,0,0,0.06); margin-bottom:10px;
      border-left:4px solid transparent;
    }
    .offer-card.pending  { border-left-color:#feca57; }
    .offer-card.rejected { border-left-color:#ffd6d6; }

    .offer-row { display:flex; align-items:flex-start; gap:10px; }
    .offer-card-img {
      width:52px; height:52px; border-radius:11px; object-fit:cover;
      background:#f4f0ff; flex-shrink:0; display:flex;
      align-items:center; justify-content:center; font-size:1.4rem; color:#ccc; overflow:hidden;
    }
    .offer-card-img img { width:100%; height:100%; object-fit:cover; }
    .offer-info { flex:1; min-width:0; }
    .offer-card-name { font-family:'Fredoka One',cursive; font-size:0.9rem; color:#333; }
    .offer-what { font-size:0.8rem; color:#555; margin-top:3px; }
    .offer-time { font-size:0.72rem; color:#ccc; margin-top:3px; }
    .status-badge {
      display:inline-block; border-radius:50px; padding:3px 11px;
      font-family:'Fredoka One',cursive; font-size:0.72rem; margin-top:5px;
    }
    .badge-pending  { background:#fff3cd; color:#856404; }
    .badge-rejected { background:#ffd6d6; color:#c0392b; }

    .cancel-btn {
      background:#f0f0f0; border:none; border-radius:50px; padding:7px 13px;
      color:#999; font-family:'Fredoka One',cursive; font-size:0.78rem;
      cursor:pointer; flex-shrink:0;
    }

    .empty { text-align:center; padding:30px; color:#ccc; font-family:'Fredoka One',cursive; font-size:0.9rem; }

    /* Bottom nav */
    .bottom-nav {
      position:fixed; bottom:0; left:0; right:0; background:white;
      border-top:2px solid #eee; padding:10px 12px 14px;
      display:flex; gap:6px; justify-content:center; z-index:200;
    }
    .bnav-btn {
      flex:1; min-width:60px; max-width:120px; background:#f4f0ff; border:none;
      border-radius:14px; padding:9px 6px; font-family:'Fredoka One',cursive;
      font-size:0.72rem; color:#a29bfe; cursor:pointer; text-decoration:none;
      text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px;
    }
    .bnav-btn.active { background:linear-gradient(135deg,#a29bfe,#ff9ff3); color:white; }
    .bnav-btn.post  { background:linear-gradient(135deg,#ff6b6b,#feca57); color:white; }
    .bnav-icon { font-size:1.2rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo">📬 My Offers</div>
    <a href="platform-kid-trade-center.html" class="nav-btn">🃏 Browse</a>
    <a href="platform-kid-dashboard.html" class="nav-btn-ghost">← Home</a>
  </header>

  <div class="container">
    <p class="section-title">🤝 Accepted — Meet Up!</p>
    <div id="acceptedList"><p class="empty">Loading...</p></div>

    <p class="section-title">⏳ Pending</p>
    <div id="pendingList"><p class="empty">Loading...</p></div>

    <p class="section-title">✕ Rejected</p>
    <div id="rejectedList"><p class="empty">Loading...</p></div>
  </div>

  <div class="bottom-nav">
    <a href="platform-kid-trade-center.html" class="bnav-btn">
      <span class="bnav-icon">🃏</span>Browse
    </a>
    <a href="platform-kid-trade-my-posts.html" class="bnav-btn post">
      <span class="bnav-icon">➕</span>Post Card
    </a>
    <a href="platform-kid-trade-offers.html" class="bnav-btn active">
      <span class="bnav-icon">📬</span>My Offers
    </a>
    <a href="platform-kid-shop.html" class="bnav-btn">
      <span class="bnav-icon">🛍️</span>Shop
    </a>
    <a href="platform-kid-dashboard.html" class="bnav-btn">
      <span class="bnav-icon">🏠</span>Home
    </a>
  </div>

  <script>
    const SUPABASE_URL = 'https://iwmviwhruzhwkokcjcnu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3bXZpd2hydXpod2tva2NqY251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTE1MzYsImV4cCI6MjA5NjMyNzUzNn0.MtHOeTGyW5Q68HfYSJW7keNJGHpO5GCwJ2735ij_-JA';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;

    async function init() {
      const raw = localStorage.getItem('kidSession');
      if (!raw) { window.location.href = 'platform-index.html'; return; }
      currentUser = JSON.parse(raw);
      load();
    }

    async function load() {
      const { data: offers } = await sb
        .from('card_offers')
        .select('*, listing:listing_id(id,card_name,card_image_url,status)')
        .eq('offerer_user_id', currentUser.kid_id)
        .order('created_at', { ascending: false });

      const all = offers || [];
      renderAccepted(all.filter(o => o.status === 'accepted'));
      renderPending(all.filter(o => o.status === 'pending'));
      renderRejected(all.filter(o => o.status === 'rejected'));
    }

    function renderAccepted(offers) {
      const el = document.getElementById('acceptedList');
      if (!offers.length) { el.innerHTML = '<p class="empty">No accepted offers yet.</p>'; return; }
      el.innerHTML = offers.map(o => `
        <div class="meetup-banner">
          <div class="icon">🤝</div>
          <div>
            <h3>Bring your cards to each other!</h3>
            <p>Your offer for <strong>${esc(o.listing?.card_name||'a card')}</strong> was accepted — time to meet up and trade!</p>
          </div>
        </div>`).join('');
    }

    function renderPending(offers) {
      const el = document.getElementById('pendingList');
      if (!offers.length) { el.innerHTML = '<p class="empty">No pending offers.</p>'; return; }
      el.innerHTML = offers.map(o => offerHTML(o)).join('');
    }

    function renderRejected(offers) {
      const el = document.getElementById('rejectedList');
      if (!offers.length) { el.innerHTML = '<p class="empty">None.</p>'; return; }
      el.innerHTML = offers.map(o => offerHTML(o)).join('');
    }

    function offerHTML(o) {
      const img = o.listing?.card_image_url
        ? `<div class="offer-card-img"><img src="${esc(o.listing.card_image_url)}" /></div>`
        : `<div class="offer-card-img">🃏</div>`;
      const money = o.offer_money ? `💰 $${Number(o.offer_money).toFixed(2)}` : '';
      const cards = o.offer_cards ? `🃏 ${esc(o.offer_cards)}` : '';
      const what = [money,cards].filter(Boolean).join(' · ');
      const cancel = o.status === 'pending'
        ? `<button class="cancel-btn" onclick="cancelOffer('${o.id}')">✕ Cancel</button>` : '';

      return `
        <div class="offer-card ${o.status}">
          <div class="offer-row">
            ${img}
            <div class="offer-info">
              <p class="offer-card-name">For: ${esc(o.listing?.card_name||'Unknown')}</p>
              ${what ? `<p class="offer-what">Your offer: ${what}</p>` : ''}
              <p class="offer-time">${new Date(o.created_at).toLocaleDateString()}</p>
              <span class="status-badge badge-${o.status}">
                ${o.status === 'pending' ? '⏳ Waiting...' : '✕ Rejected'}
              </span>
            </div>
            ${cancel}
          </div>
        </div>`;
    }

    async function cancelOffer(id) {
      if (!confirm('Cancel this offer?')) return;
      await sb.from('card_offers').delete().eq('id', id);
      load();
    }

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    init();
  </script>
</body>
</html>
