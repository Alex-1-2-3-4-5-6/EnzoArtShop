<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Card Posts – Little Heartworks</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { min-height:100vh; background:#fff9f0; font-family:'Nunito',sans-serif; padding-bottom:90px; }

    header {
      background:linear-gradient(135deg,#a29bfe,#ff9ff3);
      padding:14px 20px; display:flex; align-items:center; gap:10px;
      box-shadow:0 4px 20px rgba(162,155,254,0.3); position:sticky; top:0; z-index:40;
    }
    .logo { font-family:'Fredoka One',cursive; font-size:1.2rem; color:white; flex:1; }
    .nav-btn {
      background:white; border:none; border-radius:50px; padding:8px 16px;
      font-family:'Fredoka One',cursive; font-size:0.85rem; cursor:pointer;
      color:#a29bfe; text-decoration:none; flex-shrink:0;
    }
    .nav-btn-ghost {
      background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.5);
      border-radius:50px; padding:7px 14px; font-family:'Fredoka One',cursive;
      font-size:0.82rem; color:white; cursor:pointer; text-decoration:none; flex-shrink:0;
    }

    .container { max-width:760px; margin:0 auto; padding:22px 16px 20px; }

    /* Post form */
    .post-panel {
      background:white; border-radius:20px; padding:20px;
      box-shadow:0 4px 16px rgba(0,0,0,0.07); margin-bottom:24px;
      border:2px solid #f0eeff;
    }
    .panel-title { font-family:'Fredoka One',cursive; font-size:1.1rem; color:#333; margin-bottom:14px; }
    .form-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    .form-group { flex:1; min-width:140px; display:flex; flex-direction:column; gap:5px; }
    .form-label { font-family:'Fredoka One',cursive; font-size:0.82rem; color:#666; }
    .form-input, .form-textarea {
      padding:10px 13px; border:2.5px solid #e0e0e0; border-radius:13px;
      font-family:'Nunito',sans-serif; font-size:0.92rem; outline:none;
      transition:border-color 0.2s; width:100%;
    }
    .form-input:focus, .form-textarea:focus { border-color:#a29bfe; }
    .form-textarea { resize:vertical; min-height:60px; }
    .img-preview { width:70px; height:70px; border-radius:12px; object-fit:cover; display:none; margin-top:6px; }
    .post-btn {
      background:linear-gradient(135deg,#ff6b6b,#feca57); border:none;
      border-radius:50px; padding:11px 26px; color:white;
      font-family:'Fredoka One',cursive; font-size:0.95rem; cursor:pointer;
    }
    .msg { padding:9px 13px; border-radius:10px; font-weight:700; font-size:0.85rem;
      display:none; margin-top:10px; }
    .msg.success { background:#d4edda; color:#155724; display:block; }
    .msg.error   { background:#ffd6d6; color:#c0392b; display:block; }
    .msg.loading { background:#fff3cd; color:#856404; display:block; }

    /* Listings */
    .listing-block {
      background:white; border-radius:20px; padding:18px;
      box-shadow:0 4px 16px rgba(0,0,0,0.07); margin-bottom:20px;
      border:2px solid #f0eeff;
    }
    .listing-header { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
    .listing-img {
      width:66px; height:66px; border-radius:13px; object-fit:cover;
      background:#f4f0ff; flex-shrink:0; font-size:1.8rem;
      display:flex; align-items:center; justify-content:center; color:#ccc; overflow:hidden;
    }
    .listing-img img { width:100%; height:100%; object-fit:cover; }
    .listing-info { flex:1; min-width:0; }
    .listing-name { font-family:'Fredoka One',cursive; font-size:1rem; color:#333; }
    .listing-meta { font-size:0.78rem; color:#aaa; margin-top:3px; }
    .listing-min  { font-family:'Fredoka One',cursive; font-size:0.8rem; color:#27ae60; margin-top:3px; }
    .del-btn {
      background:#ffd6d6; border:none; border-radius:50px; padding:7px 13px;
      color:#c0392b; font-family:'Fredoka One',cursive; font-size:0.78rem; cursor:pointer;
    }
    .closed-badge {
      background:#e0e0e0; color:#888; border-radius:50px; padding:3px 11px;
      font-family:'Fredoka One',cursive; font-size:0.72rem; display:inline-block;
    }

    /* Meet-up banner */
    .meetup-banner {
      background:linear-gradient(135deg,#d4edda,#c3f0ca); border-radius:14px;
      padding:14px 16px; display:flex; align-items:center; gap:10px;
      border:2px solid #a8e6cf; margin-bottom:10px;
    }
    .meetup-banner .icon { font-size:2rem; flex-shrink:0; }
    .meetup-banner h3 { font-family:'Fredoka One',cursive; font-size:0.95rem; color:#155724; }
    .meetup-banner p  { font-size:0.78rem; color:#27ae60; margin-top:2px; }

    /* Offers */
    .offers-bar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
    .offers-title { font-family:'Fredoka One',cursive; font-size:0.85rem; color:#aaa; }
    .search-offers {
      flex:1; min-width:120px; max-width:220px; padding:7px 13px;
      border:2px solid #e0e0e0; border-radius:50px; font-family:'Nunito',sans-serif;
      font-size:0.82rem; outline:none;
    }
    .search-offers:focus { border-color:#a29bfe; }

    .offer-item {
      background:#fafafa; border-radius:13px; padding:12px 14px;
      border:2px solid #eee; margin-bottom:8px;
    }
    .offer-item.accepted { border-color:#a8e6cf; background:#f0fff8; }
    .offer-from { font-family:'Fredoka One',cursive; font-size:0.88rem; color:#333; }
    .offer-what { font-size:0.8rem; color:#555; margin-top:3px; }
    .offer-msg-text { font-size:0.76rem; color:#aaa; font-style:italic; margin-top:2px; }
    .offer-time { font-size:0.72rem; color:#ccc; margin-top:2px; }
    .offer-btns { display:flex; gap:6px; margin-top:8px; }
    .accept-btn {
      background:#d4edda; border:none; border-radius:50px; padding:7px 14px;
      color:#155724; font-family:'Fredoka One',cursive; font-size:0.78rem; cursor:pointer;
    }
    .reject-btn {
      background:#ffd6d6; border:none; border-radius:50px; padding:7px 14px;
      color:#c0392b; font-family:'Fredoka One',cursive; font-size:0.78rem; cursor:pointer;
    }

    .empty { text-align:center; padding:20px; color:#ccc; font-family:'Fredoka One',cursive; font-size:0.88rem; }

    /* Bottom nav */
    .bottom-nav {
      position:fixed; bottom:0; left:0; right:0; background:white;
      border-top:2px solid #eee; padding:10px 12px 14px;
      display:flex; gap:6px; justify-content:center; z-index:200;
    }
    .bnav-btn {
      flex:1; min-width:60px; max-width:120px; background:#f4f0ff; border:none;
      border-radius:14px; padding:9px 6px; font-family:'Fredoka One',cursive;
      font-size:0.72rem; color:#a29bfe; cursor:pointer; text-decoration:none;
      text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px;
    }
    .bnav-btn.active { background:linear-gradient(135deg,#a29bfe,#ff9ff3); color:white; }
    .bnav-btn.post  { background:linear-gradient(135deg,#ff6b6b,#feca57); color:white; }
    .bnav-icon { font-size:1.2rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo">📋 My Card Posts</div>
    <a href="platform-kid-trade-center.html" class="nav-btn">🃏 Browse</a>
    <a href="platform-kid-dashboard.html" class="nav-btn-ghost">← Home</a>
  </header>

  <div class="container">

    <!-- Post form -->
    <div class="post-panel">
      <p class="panel-title">➕ Post a Card for Trade</p>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Card name *</label>
          <input class="form-input" type="text" id="newCardName" placeholder="e.g. Charizard Holo" />
        </div>
        <div class="form-group">
          <label class="form-label">Min offer ($) — optional</label>
          <input class="form-input" type="number" id="newMinPrice" placeholder="Leave blank = any offer OK" min="0" step="0.01" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Description — optional</label>
          <textarea class="form-textarea" id="newDescription" placeholder="Condition, set, year..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Card photo — optional</label>
          <input class="form-input" type="file" id="newCardImg" accept="image/*" onchange="previewImg(this)" style="padding:6px;" />
          <img class="img-preview" id="imgPreview" />
        </div>
      </div>
      <button class="post-btn" onclick="postCard()">Post Card 🃏</button>
      <div class="msg" id="postMsg"></div>
    </div>

    <!-- My listings -->
    <p style="font-family:'Fredoka One',cursive;font-size:1rem;color:#a29bfe;margin-bottom:12px;">My Listings</p>
    <div id="listingsList"><p class="empty">Loading...</p></div>
  </div>

  <div class="bottom-nav">
    <a href="platform-kid-trade-center.html" class="bnav-btn">
      <span class="bnav-icon">🃏</span>Browse
    </a>
    <a href="platform-kid-trade-my-posts.html" class="bnav-btn active">
      <span class="bnav-icon">📋</span>My Posts
    </a>
    <a href="platform-kid-trade-offers.html" class="bnav-btn">
      <span class="bnav-icon">📬</span>My Offers
    </a>
    <a href="platform-kid-shop.html" class="bnav-btn">
      <span class="bnav-icon">🛍️</span>Shop
    </a>
    <a href="platform-kid-dashboard.html" class="bnav-btn">
      <span class="bnav-icon">🏠</span>Home
    </a>
  </div>

  <script>
    const SUPABASE_URL = 'https://iwmviwhruzhwkokcjcnu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3bXZpd2hydXpod2tva2NqY251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTE1MzYsImV4cCI6MjA5NjMyNzUzNn0.MtHOeTGyW5Q68HfYSJW7keNJGHpO5GCwJ2735ij_-JA';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;

    async function init() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) { window.location.href = 'platform-login.html'; return; }
      currentUser = user;
      loadListings();
    }

    function previewImg(input) {
      const preview = document.getElementById('imgPreview');
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function postCard() {
      const name = document.getElementById('newCardName').value.trim();
      const minPrice = parseFloat(document.getElementById('newMinPrice').value) || null;
      const desc = document.getElementById('newDescription').value.trim();
      const imgFile = document.getElementById('newCardImg').files[0];
      const msgEl = document.getElementById('postMsg');
      if (!name) { msgEl.className = 'msg error'; msgEl.textContent = 'Card name is required!'; return; }
      msgEl.className = 'msg loading'; msgEl.textContent = '⏳ Posting...';

      let imageUrl = null;
      if (imgFile) {
        const ext = imgFile.name.split('.').pop();
        const filename = `card-${currentUser.id}-${Date.now()}.${ext}`;
        const { error: upErr } = await sb.storage.from('card-images').upload(filename, imgFile, { upsert: true, contentType: imgFile.type });
        if (upErr) { msgEl.className = 'msg error'; msgEl.textContent = 'Photo upload failed: ' + upErr.message; return; }
        imageUrl = sb.storage.from('card-images').getPublicUrl(filename).data.publicUrl;
      }

      const { error } = await sb.from('card_listings').insert({
        poster_user_id: currentUser.id, card_name: name,
        description: desc || null, min_price: minPrice,
        card_image_url: imageUrl, status: 'active'
      });
      if (error) { msgEl.className = 'msg error'; msgEl.textContent = error.message; return; }

      msgEl.className = 'msg success'; msgEl.textContent = '✅ Card posted!';
      document.getElementById('newCardName').value = '';
      document.getElementById('newMinPrice').value = '';
      document.getElementById('newDescription').value = '';
      document.getElementById('newCardImg').value = '';
      document.getElementById('imgPreview').style.display = 'none';
      setTimeout(() => { msgEl.style.display = 'none'; }, 2500);
      loadListings();
    }

    async function loadListings() {
      const { data } = await sb.from('card_listings').select('*')
        .eq('poster_user_id', currentUser.id).order('created_at', { ascending: false });
      const listings = data || [];
      if (!listings.length) {
        document.getElementById('listingsList').innerHTML = '<p class="empty">No cards posted yet — post your first one above!</p>';
        return;
      }
      const ids = listings.map(l => l.id);
      const { data: offers } = await sb.from('card_offers').select('*')
        .in('listing_id', ids).order('created_at', { ascending: false });
      const byListing = {};
      (offers||[]).forEach(o => { if (!byListing[o.listing_id]) byListing[o.listing_id] = []; byListing[o.listing_id].push(o); });
      document.getElementById('listingsList').innerHTML = listings.map(l => renderListing(l, byListing[l.id]||[])).join('');
    }

    function renderListing(l, offers) {
      const img = l.card_image_url
        ? `<div class="listing-img"><img src="${esc(l.card_image_url)}" /></div>`
        : `<div class="listing-img">🃏</div>`;
      const accepted = offers.find(o => o.status === 'accepted');
      const pending  = offers.filter(o => o.status === 'pending');

      let meetup = '';
      if (accepted) meetup = `
        <div class="meetup-banner">
          <div class="icon">🤝</div>
          <div>
            <h3>Bring your cards to each other!</h3>
            <p>You accepted ${esc(accepted.offerer_name)}'s offer — time to meet up!</p>
          </div>
        </div>`;

      return `
        <div class="listing-block">
          <div class="listing-header">
            ${img}
            <div class="listing-info">
              <p class="listing-name">${esc(l.card_name)}</p>
              ${l.description ? `<p class="listing-meta">${esc(l.description)}</p>` : ''}
              ${l.min_price ? `<p class="listing-min">💰 Min: $${Number(l.min_price).toFixed(2)}</p>` : ''}
              ${l.status === 'closed' ? '<span class="closed-badge">✅ Closed</span>' : ''}
            </div>
            ${l.status === 'active' ? `<button class="del-btn" onclick="deleteListing('${l.id}')">🗑️ Remove</button>` : ''}
          </div>
          ${meetup}
          <div class="offers-bar">
            <span class="offers-title">${pending.length} pending · ${offers.length} total offers</span>
            ${offers.length ? `<input class="search-offers" placeholder="🔍 Search offers..." oninput="filterOffers(this,'${l.id}')" />` : ''}
          </div>
          <div id="offers-${l.id}">
            ${renderOffers(offers, l)}
          </div>
        </div>`;
    }

    function renderOffers(offers, listing) {
      if (!offers.length) return '<p class="empty" style="padding:10px">No offers yet.</p>';
      return offers.map(o => {
        const money = o.offer_money ? `💰 $${Number(o.offer_money).toFixed(2)}` : '';
        const cards = o.offer_cards ? `🃏 ${esc(o.offer_cards)}` : '';
        const what = [money,cards].filter(Boolean).join(' · ');
        let actions = '';
        if (o.status === 'pending' && listing.status === 'active') {
          actions = `<div class="offer-btns">
            <button class="accept-btn" onclick="acceptOffer('${listing.id}','${o.id}','${esc(o.offerer_name)}')">✅ Accept</button>
            <button class="reject-btn" onclick="rejectOffer('${o.id}')">✕ Reject</button>
          </div>`;
        } else if (o.status === 'accepted') {
          actions = `<p style="font-family:'Fredoka One',cursive;font-size:0.78rem;color:#27ae60;margin-top:6px;">✅ Accepted</p>`;
        } else if (o.status === 'rejected') {
          actions = `<p style="font-family:'Fredoka One',cursive;font-size:0.78rem;color:#aaa;margin-top:6px;">✕ Rejected</p>`;
        }
        return `
          <div class="offer-item ${o.status==='accepted'?'accepted':''}"
            data-search="${(o.offer_money||'')} ${(o.offer_cards||'')} ${(o.offerer_name||'')}">
            <p class="offer-from">From: ${esc(o.offerer_name||'Someone')}</p>
            ${what ? `<p class="offer-what">${what}</p>` : ''}
            ${o.message ? `<p class="offer-msg-text">"${esc(o.message)}"</p>` : ''}
            <p class="offer-time">${new Date(o.created_at).toLocaleDateString()}</p>
            ${actions}
          </div>`;
      }).join('');
    }

    function filterOffers(input, listingId) {
      const q = input.value.toLowerCase().trim();
      document.getElementById(`offers-${listingId}`).querySelectorAll('.offer-item').forEach(el => {
        el.style.display = !q || el.dataset.search.toLowerCase().includes(q) ? '' : 'none';
      });
    }

    async function acceptOffer(listingId, offerId, name) {
      if (!confirm(`Accept offer from ${name}?`)) return;
      await sb.from('card_offers').update({ status:'accepted' }).eq('id', offerId);
      await sb.from('card_offers').update({ status:'rejected' }).eq('listing_id', listingId).neq('id', offerId).eq('status','pending');
      await sb.from('card_listings').update({ status:'closed' }).eq('id', listingId);
      loadListings();
    }

    async function rejectOffer(offerId) {
      await sb.from('card_offers').update({ status:'rejected' }).eq('id', offerId);
      loadListings();
    }

    async function deleteListing(id) {
      if (!confirm('Remove this listing?')) return;
      await sb.from('card_offers').delete().eq('listing_id', id);
      await sb.from('card_listings').delete().eq('id', id);
      loadListings();
    }

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    init();
  </script>
</body>
</html>
