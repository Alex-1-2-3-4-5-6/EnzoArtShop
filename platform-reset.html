<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – Little Heartworks</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height:100vh; font-family:'Nunito',sans-serif;
      background:linear-gradient(135deg,#48dbfb,#a29bfe,#ff9ff3);
      background-size:300% 300%; animation:gradientShift 8s ease infinite;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    .card {
      background:white; border-radius:28px; padding:40px 36px;
      max-width:420px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.2);
    }
    .back-btn {
      display:inline-flex; align-items:center; gap:6px;
      color:#aaa; font-weight:700; font-size:0.88rem; text-decoration:none;
      margin-bottom:22px; transition:color 0.15s;
    }
    .back-btn:hover { color:#a29bfe; }
    .logo { font-family:'Fredoka One',cursive; font-size:1.4rem; color:#ff6b6b; margin-bottom:8px; }
    .logo span { color:#a29bfe; }
    h2 { font-family:'Fredoka One',cursive; font-size:1.9rem; color:#333; margin-bottom:4px; }
    .sub { color:#aaa; font-size:0.9rem; margin-bottom:28px; }

    .field { margin-bottom:16px; }
    .field label { display:block; font-weight:700; color:#555; margin-bottom:6px; font-size:0.9rem; }
    .field input {
      width:100%; padding:13px 16px; border:2.5px solid #e0e0e0;
      border-radius:12px; font-family:'Nunito',sans-serif; font-size:1rem;
      outline:none; transition:border-color 0.2s;
    }
    .field input:focus { border-color:#a29bfe; }
    .pw-wrap { position:relative; }
    .pw-wrap input { padding-right:46px; }
    .pw-toggle {
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer; font-size:1.1rem; color:#bbb;
    }

    .submit-btn {
      width:100%; background:linear-gradient(135deg,#a29bfe,#ff9ff3);
      border:none; border-radius:50px; padding:15px;
      color:white; font-family:'Fredoka One',cursive; font-size:1.15rem;
      cursor:pointer; transition:transform 0.18s;
    }
    .submit-btn:hover { transform:scale(1.02); }
    .submit-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

    .msg { margin-top:14px; padding:12px 16px; border-radius:12px; font-weight:700; font-size:0.9rem; display:none; }
    .msg.error   { background:#ffd6d6; color:#c0392b; }
    .msg.success { background:#d4edda; color:#155724; }

    .bottom-links { text-align:center; margin-top:20px; font-size:0.9rem; color:#aaa; }
    .bottom-links a { color:#a29bfe; font-weight:700; text-decoration:none; }
    .bottom-links a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="card" id="requestCard">
    <a href="platform-login.html" class="back-btn">← Back to Login</a>
    <div class="logo">Little He<span>art</span>works</div>
    <h2>Reset Password</h2>
    <p class="sub">Enter your email and we'll send a reset link</p>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')sendReset()" />
    </div>

    <button class="submit-btn" id="sendBtn" onclick="sendReset()">📧 Send Reset Link</button>
    <div class="msg" id="requestMsg"></div>
  </div>

  <div class="card" id="newPwCard" style="display:none;">
    <div class="logo">Little He<span>art</span>works</div>
    <h2>New Password</h2>
    <p class="sub">Choose a new password for your account</p>

    <div class="field">
      <label for="newPw">New Password</label>
      <div class="pw-wrap">
        <input type="password" id="newPw" placeholder="At least 6 characters" />
        <button type="button" class="pw-toggle" onclick="togglePw('newPw',this)">👁</button>
      </div>
    </div>
    <div class="field">
      <label for="confirmPw">Confirm Password</label>
      <div class="pw-wrap">
        <input type="password" id="confirmPw" placeholder="Same password again" onkeydown="if(event.key==='Enter')savePw()" />
        <button type="button" class="pw-toggle" onclick="togglePw('confirmPw',this)">👁</button>
      </div>
    </div>

    <button class="submit-btn" id="saveBtn" onclick="savePw()">✅ Save New Password</button>
    <div class="msg" id="newPwMsg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://iwmviwhruzhwkokcjcnu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3bXZpd2hydXpod2tva2NqY251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTE1MzYsImV4cCI6MjA5NjMyNzUzNn0.MtHOeTGyW5Q68HfYSJW7keNJGHpO5GCwJ2735ij_-JA';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        document.getElementById('requestCard').style.display = 'none';
        document.getElementById('newPwCard').style.display = 'block';
      }
    });

    function togglePw(fieldId, btn) {
      const el = document.getElementById(fieldId);
      el.type = el.type === 'password' ? 'text' : 'password';
      btn.textContent = el.type === 'password' ? '👁' : '🙈';
    }

    async function sendReset() {
      const email = document.getElementById('email').value.trim();
      const btn   = document.getElementById('sendBtn');
      const msg   = document.getElementById('requestMsg');
      if (!email) {
        msg.className = 'msg error'; msg.textContent = 'Please enter your email.'; msg.style.display = 'block'; return;
      }
      btn.disabled = true; btn.textContent = 'Sending...';
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://littleheartworks.net/platform-reset.html'
      });
      if (error) {
        msg.className = 'msg error'; msg.textContent = '❌ ' + error.message; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = '📧 Send Reset Link';
      } else {
        msg.className = 'msg success';
        msg.textContent = '✅ Check your email for a reset link! It may take a minute.';
        msg.style.display = 'block';
        btn.disabled = true; btn.textContent = 'Sent!';
      }
    }

    async function savePw() {
      const pw      = document.getElementById('newPw').value;
      const confirm = document.getElementById('confirmPw').value;
      const btn     = document.getElementById('saveBtn');
      const msg     = document.getElementById('newPwMsg');
      if (pw.length < 6) {
        msg.className = 'msg error'; msg.textContent = 'Password must be at least 6 characters.'; msg.style.display = 'block'; return;
      }
      if (pw !== confirm) {
        msg.className = 'msg error'; msg.textContent = 'Passwords do not match.'; msg.style.display = 'block'; return;
      }
      btn.disabled = true; btn.textContent = 'Saving...';
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) {
        msg.className = 'msg error'; msg.textContent = '❌ ' + error.message; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = '✅ Save New Password';
      } else {
        msg.className = 'msg success'; msg.textContent = '✅ Password updated! Taking you to the shop...'; msg.style.display = 'block';
        setTimeout(() => window.location.href = 'platform-shop.html', 2000);
      }
    }
  </script>
</body>
</html>
