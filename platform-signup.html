<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – Little Heartworks</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height:100vh; font-family:'Nunito',sans-serif;
      background:linear-gradient(135deg,#ff9ff3,#feca57,#48dbfb,#a29bfe);
      background-size:300% 300%; animation:gradientShift 8s ease infinite;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    .card {
      background:white; border-radius:28px; padding:40px 36px;
      max-width:460px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.2);
    }

    .back-btn {
      display:inline-flex; align-items:center; gap:6px;
      color:#aaa; font-weight:700; font-size:0.88rem; text-decoration:none;
      margin-bottom:22px; transition:color 0.15s;
    }
    .back-btn:hover { color:#ff6b6b; }

    .logo { font-family:'Fredoka One',cursive; font-size:1.4rem; color:#ff6b6b; margin-bottom:8px; }
    .logo span { color:#a29bfe; }
    h2 { font-family:'Fredoka One',cursive; font-size:1.9rem; color:#333; margin-bottom:4px; }
    .sub { color:#aaa; font-size:0.9rem; margin-bottom:20px; }

    .notice {
      background:#f4f0ff; border-radius:12px; padding:13px 16px;
      font-size:0.83rem; color:#777; line-height:1.55; margin-bottom:22px;
    }
    .notice strong { color:#a29bfe; }

    .field { margin-bottom:16px; }
    .field label { display:block; font-weight:700; color:#555; margin-bottom:6px; font-size:0.9rem; }
    .field input {
      width:100%; padding:13px 16px; border:2.5px solid #e0e0e0;
      border-radius:12px; font-family:'Nunito',sans-serif; font-size:1rem;
      outline:none; transition:border-color 0.2s;
    }
    .field input:focus { border-color:#feca57; }

    .dob-row { display:flex; gap:8px; }
    .dob-row select {
      padding:13px 10px; border:2.5px solid #e0e0e0; border-radius:12px;
      font-family:'Nunito',sans-serif; font-size:0.95rem; outline:none;
      background:white; transition:border-color 0.2s; cursor:pointer;
    }
    .dob-row select:focus { border-color:#feca57; }
    .dob-row .sel-month { flex:2; }
    .dob-row .sel-day   { flex:1; }
    .dob-row .sel-year  { flex:1.5; }

    .pw-wrap { position:relative; }
    .pw-wrap input { padding-right:46px; }
    .pw-toggle {
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer; font-size:1.1rem; color:#bbb;
    }

    .check-row {
      display:flex; align-items:flex-start; gap:12px; margin-bottom:12px;
    }
    .check-row input[type=checkbox] {
      width:20px; height:20px; margin-top:2px; accent-color:#ff6b6b;
      flex-shrink:0; cursor:pointer;
    }
    .check-row label { font-size:0.88rem; color:#555; line-height:1.55; cursor:pointer; }
    .check-row a { color:#ff6b6b; font-weight:700; text-decoration:none; }
    .check-row a:hover { text-decoration:underline; }

    .submit-btn {
      width:100%; background:linear-gradient(135deg,#ff6b6b,#feca57);
      border:none; border-radius:50px; padding:15px; margin-top:8px;
      color:white; font-family:'Fredoka One',cursive; font-size:1.15rem;
      cursor:pointer; transition:transform 0.18s;
    }
    .submit-btn:hover { transform:scale(1.02); }
    .submit-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

    .msg { margin-top:14px; padding:12px 16px; border-radius:12px; font-weight:700; font-size:0.9rem; display:none; }
    .msg.error   { background:#ffd6d6; color:#c0392b; }
    .msg.success { background:#d4edda; color:#155724; }

    .bottom-links { text-align:center; margin-top:20px; font-size:0.9rem; color:#aaa; }
    .bottom-links a { color:#ff6b6b; font-weight:700; text-decoration:none; }
    .bottom-links a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="card">
    <a href="platform-index.html" class="back-btn">← Back</a>

    <div class="logo">Little He<span>art</span>works</div>
    <h2>Create Account</h2>
    <p class="sub">For parents &amp; guardians only</p>

    <div class="notice">
      <strong>🔒 Parents only.</strong> This account is for adults who manage their child's artwork. Kids sign in using a 10-digit code from the home screen — no personal info needed.
    </div>

    <div class="field">
      <label for="name">Your Full Name</label>
      <input type="text" id="name" placeholder="e.g. Maria Garcia" />
    </div>

    <div class="field">
      <label>Date of Birth <span style="color:#bbb;font-weight:400;font-size:0.8rem;">(must be 18 or older)</span></label>
      <div class="dob-row">
        <select id="dobMonth" class="sel-month">
          <option value="">Month</option>
          <option value="1">January</option><option value="2">February</option><option value="3">March</option>
          <option value="4">April</option><option value="5">May</option><option value="6">June</option>
          <option value="7">July</option><option value="8">August</option><option value="9">September</option>
          <option value="10">October</option><option value="11">November</option><option value="12">December</option>
        </select>
        <select id="dobDay" class="sel-day"><option value="">Day</option></select>
        <select id="dobYear" class="sel-year"><option value="">Year</option></select>
      </div>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="your@email.com" />
    </div>

    <div class="field">
      <label for="password">Password <span style="color:#bbb;font-weight:400;font-size:0.8rem;">(at least 6 characters)</span></label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Create a password" />
        <button type="button" class="pw-toggle" onclick="togglePw('password',this)">👁</button>
      </div>
    </div>

    <div class="field">
      <label for="confirm">Confirm Password</label>
      <div class="pw-wrap">
        <input type="password" id="confirm" placeholder="Repeat your password" />
        <button type="button" class="pw-toggle" onclick="togglePw('confirm',this)">👁</button>
      </div>
    </div>

    <div class="check-row">
      <input type="checkbox" id="agreeTerms" />
      <label for="agreeTerms">
        I have read and agree to the <a href="platform-terms.html" target="_blank">Terms of Use</a>
      </label>
    </div>

    <div class="check-row">
      <input type="checkbox" id="agreePrivacy" />
      <label for="agreePrivacy">
        I have read and agree to the <a href="platform-privacy.html" target="_blank">Privacy Policy</a>
      </label>
    </div>

    <div class="check-row">
      <input type="checkbox" id="agreeAge" />
      <label for="agreeAge">I confirm I am a parent or guardian aged 18 or older</label>
    </div>

    <button class="submit-btn" id="signupBtn" onclick="signup()">Create Account</button>
    <div class="msg" id="msg"></div>

    <p class="bottom-links">Already have an account? <a href="platform-login.html">Log in</a></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://iwmviwhruzhwkokcjcnu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3bXZpd2hydXpod2tva2NqY251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTE1MzYsImV4cCI6MjA5NjMyNzUzNn0.MtHOeTGyW5Q68HfYSJW7keNJGHpO5GCwJ2735ij_-JA';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Populate day + year dropdowns
    const dayEl  = document.getElementById('dobDay');
    const yearEl = document.getElementById('dobYear');
    for (let d = 1; d <= 31; d++) { const o = document.createElement('option'); o.value = d; o.textContent = d; dayEl.appendChild(o); }
    const curYear = new Date().getFullYear();
    for (let y = curYear - 18; y >= curYear - 100; y--) { const o = document.createElement('option'); o.value = y; o.textContent = y; yearEl.appendChild(o); }

    function togglePw(id, btn) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
      btn.textContent = el.type === 'password' ? '👁' : '🙈';
    }

    function showMsg(type, text) {
      const el = document.getElementById('msg');
      el.className = 'msg ' + type; el.textContent = text; el.style.display = 'block';
    }

    async function signup() {
      const name     = document.getElementById('name').value.trim();
      const month    = document.getElementById('dobMonth').value;
      const day      = document.getElementById('dobDay').value;
      const year     = document.getElementById('dobYear').value;
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      const btn      = document.getElementById('signupBtn');

      if (!name)                  return showMsg('error', 'Please enter your name.');
      if (!month || !day || !year) return showMsg('error', 'Please enter your full date of birth.');

      const dob = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const age = Math.floor((new Date() - new Date(dob)) / (365.25 * 24 * 60 * 60 * 1000));
      if (age < 18) return showMsg('error', '❌ You must be 18 or older to create a parent account.');

      if (!email)              return showMsg('error', 'Please enter your email address.');
      if (password.length < 6) return showMsg('error', 'Password must be at least 6 characters.');
      if (password !== confirm) return showMsg('error', 'Passwords do not match.');

      if (!document.getElementById('agreeTerms').checked)   return showMsg('error', 'Please agree to the Terms of Use.');
      if (!document.getElementById('agreePrivacy').checked) return showMsg('error', 'Please agree to the Privacy Policy.');
      if (!document.getElementById('agreeAge').checked)     return showMsg('error', 'Please confirm you are 18 or older.');

      btn.disabled = true; btn.textContent = 'Creating account...';

      const { error } = await sb.auth.signUp({
        email, password,
        options: { data: { full_name: name, date_of_birth: dob } }
      });

      if (error) {
        showMsg('error', '❌ ' + error.message);
        btn.disabled = false; btn.textContent = 'Create Account';
      } else {
        showMsg('success', '✅ Account created! Redirecting to log in...');
        btn.textContent = 'Done!';
        setTimeout(() => window.location.href = 'platform-login.html', 2000);
      }
    }
  </script>
</body>
</html>
