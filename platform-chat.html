<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat – Little Heartworks</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { min-height:100vh; background:#f4f6ff; font-family:'Nunito',sans-serif; display:flex; flex-direction:column; }

    header {
      background:white; padding:14px 24px;
      display:flex; align-items:center; gap:12px;
      box-shadow:0 2px 12px rgba(0,0,0,0.07); flex-shrink:0;
    }
    .logo { font-family:'Fredoka One',cursive; font-size:1.3rem; color:#ff6b6b; flex:1; }
    .logo span { color:#a29bfe; }
    .back-btn { background:#f0f0f0; border:none; border-radius:50px; padding:7px 16px; font-family:'Fredoka One',cursive; font-size:0.88rem; cursor:pointer; color:#888; text-decoration:none; }

    .chat-header {
      background:white; border-bottom:2px solid #f0f0f0;
      padding:14px 20px; display:flex; align-items:center; gap:12px; flex-shrink:0;
    }
    .chat-avatar {
      width:40px; height:40px; border-radius:50%; border:2px solid #a29bfe;
      background:#f4f0ff; display:flex; align-items:center; justify-content:center;
      font-size:1.2rem; overflow:hidden; flex-shrink:0;
    }
    .chat-avatar img { width:100%; height:100%; object-fit:cover; }
    .chat-with-name { font-family:'Fredoka One',cursive; font-size:1.05rem; color:#333; }
    .chat-status { font-size:0.78rem; color:#aaa; margin-top:1px; }

    .messages-wrap {
      flex:1; overflow-y:auto; padding:16px 20px;
      display:flex; flex-direction:column; gap:10px;
      max-width:700px; width:100%; margin:0 auto; width:100%;
    }

    .msg-row { display:flex; gap:8px; align-items:flex-end; }
    .msg-row.mine { flex-direction:row-reverse; }
    .msg-bubble {
      max-width:72%; padding:10px 14px; border-radius:18px;
      font-size:0.9rem; line-height:1.5; word-break:break-word;
    }
    .msg-row.theirs .msg-bubble { background:white; color:#333; border-radius:18px 18px 18px 4px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
    .msg-row.mine   .msg-bubble { background:linear-gradient(135deg,#a29bfe,#ff9ff3); color:white; border-radius:18px 18px 4px 18px; }
    .msg-time { font-size:0.68rem; color:#ccc; margin-top:4px; text-align:right; }
    .msg-row.theirs .msg-time { text-align:left; }

    .input-bar {
      background:white; border-top:2px solid #f0f0f0;
      padding:12px 20px; display:flex; gap:10px; align-items:center; flex-shrink:0;
      max-width:700px; width:100%; margin:0 auto; width:100%;
    }
    .chat-input {
      flex:1; padding:12px 18px; border:2px solid #e0e0e0; border-radius:50px;
      font-family:'Nunito',sans-serif; font-size:0.95rem; outline:none; resize:none;
    }
    .chat-input:focus { border-color:#a29bfe; }
    .send-btn {
      background:linear-gradient(135deg,#a29bfe,#ff9ff3); border:none; border-radius:50%;
      width:44px; height:44px; color:white; font-size:1.2rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
      transition:transform 0.15s;
    }
    .send-btn:hover { transform:scale(1.08); }
    .send-btn:disabled { opacity:0.5; cursor:default; transform:none; }

    .date-sep { text-align:center; font-size:0.75rem; color:#ccc; margin:6px 0; }
    .empty-chat { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; color:#ccc; }
    .empty-chat .icon { font-size:3rem; }
    .empty-chat p { font-family:'Fredoka One',cursive; font-size:1rem; }

    .filter-notice { background:#fff3cd; border-radius:10px; padding:8px 14px; font-size:0.8rem; color:#856404; text-align:center; margin:0 20px 8px; display:none; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Little He<span>art</span>works</div>
    <a href="platform-shop.html" class="back-btn">← Shop</a>
  </header>

  <div class="chat-header">
    <div class="chat-avatar" id="chatAvatar">💬</div>
    <div>
      <p class="chat-with-name" id="chatWithName">Loading...</p>
      <p class="chat-status">Direct message</p>
    </div>
  </div>

  <div class="filter-notice" id="filterNotice">⚠️ Some words were removed from your message.</div>

  <div class="messages-wrap" id="messagesWrap">
    <div class="empty-chat" id="emptyChat">
      <div class="icon">💬</div>
      <p>No messages yet — say hi!</p>
    </div>
  </div>

  <div class="input-bar">
    <input class="chat-input" id="chatInput" placeholder="Type a message..." maxlength="500"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}" />
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://iwmviwhruzhwkokcjcnu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3bXZpd2hydXpod2tva2NqY251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTE1MzYsImV4cCI6MjA5NjMyNzUzNn0.MtHOeTGyW5Q68HfYSJW7keNJGHpO5GCwJ2735ij_-JA';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const BAD_WORDS = ['fuck','shit','bitch','ass','crap','damn','hell','bastard','dick','cock','pussy','cunt','whore','slut','piss','fag','nigger','nigga','retard','rape','kill yourself','kys','suck balls'];

    function filterText(text) {
      let filtered = text;
      let changed = false;
      BAD_WORDS.forEach(w => {
        const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
        if (re.test(filtered)) { changed = true; filtered = filtered.replace(re, '*'.repeat(w.length)); }
      });
      return { filtered, changed };
    }

    let currentUser = null;
    let otherUserId = null;
    let otherProfile = null;
    let messages = [];
    let channel = null;

    async function init() {
      const params = new URLSearchParams(window.location.search);
      otherUserId = params.get('with');

      const { data: { user } } = await sb.auth.getUser();
      if (!user) { window.location.href = 'platform-login.html'; return; }
      if (!otherUserId) { document.getElementById('chatWithName').textContent = 'Error: no user specified'; return; }
      if (otherUserId === user.id) { document.getElementById('chatWithName').textContent = 'You can\'t chat with yourself!'; return; }
      currentUser = user;

      // Load other user's profile from profiles table (or artworks for their name/avatar)
      const { data: artData } = await sb.from('artworks')
        .select('parent_name, parent_avatar_url')
        .eq('parent_id', otherUserId)
        .limit(1)
        .single();
      if (artData) {
        otherProfile = { name: artData.parent_name || 'User', avatar: artData.parent_avatar_url };
        document.getElementById('chatWithName').textContent = otherProfile.name;
        if (otherProfile.avatar) {
          document.getElementById('chatAvatar').innerHTML = `<img src="${otherProfile.avatar}" alt="${otherProfile.name}" />`;
        }
      } else {
        document.getElementById('chatWithName').textContent = 'User';
      }

      await loadMessages();
      subscribeRealtime();
    }

    async function loadMessages() {
      const { data } = await sb.from('messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });
      messages = data || [];
      renderMessages();

      // Mark received messages as read
      await sb.from('messages').update({ read: true })
        .eq('sender_id', otherUserId).eq('receiver_id', currentUser.id).eq('read', false);
    }

    function renderMessages() {
      const wrap = document.getElementById('messagesWrap');
      const empty = document.getElementById('emptyChat');
      if (!messages.length) { empty.style.display='flex'; return; }
      empty.style.display = 'none';

      let lastDate = '';
      wrap.innerHTML = messages.map(m => {
        const mine = m.sender_id === currentUser.id;
        const d = new Date(m.created_at);
        const dateStr = d.toLocaleDateString();
        const timeStr = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
        let sep = '';
        if (dateStr !== lastDate) { sep = `<div class="date-sep">${dateStr}</div>`; lastDate = dateStr; }
        return `${sep}<div class="msg-row ${mine?'mine':'theirs'}">
          <div>
            <div class="msg-bubble">${escHtml(m.content)}</div>
            <div class="msg-time">${timeStr}</div>
          </div>
        </div>`;
      }).join('');
      wrap.scrollTop = wrap.scrollHeight;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function subscribeRealtime() {
      channel = sb.channel('chat-' + [currentUser.id, otherUserId].sort().join('-'))
        .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, payload => {
          const m = payload.new;
          const isRelevant = (m.sender_id === currentUser.id && m.receiver_id === otherUserId) ||
                             (m.sender_id === otherUserId && m.receiver_id === currentUser.id);
          if (isRelevant && !messages.find(x => x.id === m.id)) {
            messages.push(m);
            renderMessages();
            if (m.sender_id === otherUserId) {
              sb.from('messages').update({ read: true }).eq('id', m.id);
            }
          }
        })
        .subscribe();
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const raw = input.value.trim();
      if (!raw) return;

      const { filtered, changed } = filterText(raw);
      if (changed) {
        const notice = document.getElementById('filterNotice');
        notice.style.display = 'block';
        setTimeout(() => notice.style.display = 'none', 3000);
      }

      input.value = '';
      document.getElementById('sendBtn').disabled = true;

      const { error } = await sb.from('messages').insert({
        sender_id: currentUser.id,
        receiver_id: otherUserId,
        content: filtered
      });

      document.getElementById('sendBtn').disabled = false;
      if (error) { input.value = raw; alert('Error: ' + error.message); }
    }

    init();
  </script>
</body>
</html>
