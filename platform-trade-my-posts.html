<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Posts – Little Heartworks</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { min-height:100vh; background:#f4f6ff; font-family:'Nunito',sans-serif; }
    header {
      background:white; padding:14px 28px; display:flex; align-items:center; gap:12px;
      box-shadow:0 2px 12px rgba(0,0,0,0.07); position:sticky; top:0; z-index:40;
    }
    .logo { font-family:'Fredoka One',cursive; font-size:1.3rem; color:#ff6b6b; flex:1; }
    .logo span { color:#a29bfe; }
    .hbtn {
      background:white; border:2px solid #eee; border-radius:50px; padding:8px 18px;
      font-family:'Fredoka One',cursive; font-size:0.88rem; cursor:pointer;
      color:#555; text-decoration:none; white-space:nowrap;
    }
    .container { max-width:760px; margin:0 auto; padding:28px 20px 60px; }
    .panel { background:white; border-radius:20px; padding:26px; box-shadow:0 4px 16px rgba(0,0,0,0.06); margin-bottom:28px; }
    .panel-title { font-family:'Fredoka One',cursive; font-size:1.2rem; color:#333; margin-bottom:18px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media(max-width:520px){.form-grid{grid-template-columns:1fr;}}
    label { display:block; font-weight:700; font-size:0.85rem; color:#555; margin-bottom:5px; }
    .field { margin-bottom:0; }
    .field input, .field textarea {
      width:100%; padding:10px 14px; border:2px solid #eee; border-radius:12px;
      font-family:'Nunito',sans-serif; font-size:0.92rem; outline:none; resize:vertical;
    }
    .field input:focus, .field textarea:focus { border-color:#a29bfe; }
    .field-full { grid-column:1/-1; }
    .img-preview { width:80px; height:80px; border-radius:12px; object-fit:cover; margin-top:8px; display:none; }
    .post-btn {
      background:linear-gradient(135deg,#ff6b6b,#feca57); border:none; border-radius:50px;
      padding:12px 28px; font-family:'Fredoka One',cursive; font-size:1rem;
      color:white; cursor:pointer; margin-top:16px;
    }
    .msg { padding:10px 14px; border-radius:10px; font-weight:700; font-size:0.88rem; margin-top:12px; display:none; }
    .msg.success { background:#d4edda; color:#155724; }
    .msg.error { background:#ffd6d6; color:#c0392b; }
    .msg.loading { background:#fff3cd; color:#856404; }

    .listing-card { background:#fafafa; border-radius:14px; padding:16px; margin-bottom:12px; border:2px solid #eee; }
    .listing-header { display:flex; align-items:flex-start; gap:12px; margin-bottom:10px; }
    .listing-thumb { width:60px; height:60px; border-radius:10px; object-fit:cover; background:#f0f0f0; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1.6rem; overflow:hidden; }
    .listing-thumb img { width:100%; height:100%; object-fit:cover; }
    .listing-info { flex:1; }
    .listing-name { font-family:'Fredoka One',cursive; font-size:1rem; color:#333; }
    .listing-meta { font-size:0.78rem; color:#aaa; margin-top:2px; }
    .delete-btn { background:#ffd6d6; border:none; border-radius:50px; padding:6px 12px; color:#c0392b; font-family:'Fredoka One',cursive; font-size:0.78rem; cursor:pointer; flex-shrink:0; }

    .offers-label { font-family:'Fredoka One',cursive; font-size:0.85rem; color:#a29bfe; margin-bottom:8px; }
    .search-offers { padding:7px 12px; border:2px solid #eee; border-radius:50px; font-family:'Nunito',sans-serif; font-size:0.82rem; outline:none; width:100%; margin-bottom:8px; }
    .search-offers:focus { border-color:#a29bfe; }
    .offer-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #f0f0f0; flex-wrap:wrap; }
    .offer-row:last-child { border-bottom:none; }
    .offer-what { flex:1; font-size:0.82rem; color:#555; }
    .accept-btn { background:#d4edda; border:none; border-radius:50px; padding:6px 12px; color:#155724; font-family:'Fredoka One',cursive; font-size:0.75rem; cursor:pointer; }
    .reject-btn { background:#ffd6d6; border:none; border-radius:50px; padding:6px 12px; color:#c0392b; font-family:'Fredoka One',cursive; font-size:0.75rem; cursor:pointer; }
    .meetup-banner { background:linear-gradient(135deg,#d4edda,#c3f0ca); border-radius:14px; padding:12px 16px; margin-top:8px; border:2px solid #a8e6cf; }
    .meetup-banner p { font-family:'Fredoka One',cursive; font-size:0.9rem; color:#155724; }
    .empty { text-align:center; padding:20px; color:#ccc; font-family:'Fredoka One',cursive; font-size:0.88rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Little <span>Heart</span>works</div>
    <a href="platform-trade-center.html" class="hbtn">🃏 Browse</a>
    <a href="platform-my-trades.html" class="hbtn">📬 My Offers</a>
    <a href="platform-shop.html" class="hbtn">← Shop</a>
  </header>

  <div class="container">
    <div class="panel">
      <p class="panel-title">➕ Post a Card for Trade</p>
      <div class="form-grid">
        <div class="field">
          <label>Card name *</label>
          <input type="text" id="cardName" placeholder="e.g. Charizard Holo" />
        </div>
        <div class="field">
          <label>Minimum offer ($)</label>
          <input type="number" id="minPrice" min="0" step="0.01" placeholder="Leave blank = any offer OK" />
        </div>
        <div class="field field-full">
          <label>Description <span style="font-weight:400;color:#aaa;">(optional)</span></label>
          <textarea id="description" rows="2" placeholder="Condition, set, etc."></textarea>
        </div>
        <div class="field">
          <label>Card image <span style="font-weight:400;color:#aaa;">(optional)</span></label>
          <input type="file" id="cardImage" accept="image/*" onchange="previewImg(this)" />
          <img id="imgPreview" class="img-preview" />
        </div>
      </div>
      <button class="post-btn" onclick="postCard()">Post Card 🃏</button>
      <div class="msg" id="postMsg"></div>
    </div>

    <div class="panel">
      <p class="panel-title">📋 My Listed Cards</p>
      <div id="myListings"><p class="empty">Loading...</p></div>
    </div>
  </div>

  <!-- Meeting modal -->
  <div id="meetingModalBg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;align-items:center;justify-content:center;padding:20px;">
    <div style="background:white;border-radius:24px;padding:28px;max-width:420px;width:100%;">
      <p style="font-family:'Fredoka One',cursive;font-size:1.2rem;color:#333;margin-bottom:6px;">📅 Schedule Meeting</p>
      <p style="font-size:0.85rem;color:#aaa;margin-bottom:18px;">Propose a time and place to swap cards!</p>
      <div class="field" style="margin-bottom:14px;">
        <label>Meeting location</label>
        <input type="text" id="meetingLocation" placeholder="e.g. Front of school, park on Main St..." style="width:100%;padding:10px 14px;border:2px solid #eee;border-radius:12px;font-family:'Nunito',sans-serif;font-size:0.92rem;outline:none;" onfocus="this.style.borderColor='#a29bfe'" onblur="this.style.borderColor='#eee'" />
      </div>
      <div class="field" style="margin-bottom:18px;">
        <label>Date and time</label>
        <input type="datetime-local" id="meetingDatetime" style="width:100%;padding:10px 14px;border:2px solid #eee;border-radius:12px;font-family:'Nunito',sans-serif;font-size:0.92rem;outline:none;" onfocus="this.style.borderColor='#a29bfe'" onblur="this.style.borderColor='#eee'" />
      </div>
      <p id="meetingMsg" style="font-size:0.82rem;color:#c0392b;margin-bottom:10px;"></p>
      <div style="display:flex;gap:10px;">
        <button onclick="closeMeetingModal()" style="flex:1;background:#f0f0f0;border:none;border-radius:50px;padding:11px;font-family:'Fredoka One',cursive;font-size:0.9rem;color:#999;cursor:pointer;">Cancel</button>
        <button id="meetingConfirmBtn" onclick="confirmMeeting()" style="flex:2;background:linear-gradient(135deg,#a29bfe,#ff9ff3);border:none;border-radius:50px;padding:11px;font-family:'Fredoka One',cursive;font-size:0.9rem;color:white;cursor:pointer;">Send ✉️</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://iwmviwhruzhwkokcjcnu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3bXZpd2hydXpod2tva2NqY251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTE1MzYsImV4cCI6MjA5NjMyNzUzNn0.MtHOeTGyW5Q68HfYSJW7keNJGHpO5GCwJ2735ij_-JA';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;
    let offerSearches = {};

    async function init() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) { window.location.href = 'platform-login.html'; return; }
      currentUser = user;
      loadMyListings();
    }

    function previewImg(input) {
      const file = input.files[0];
      if (!file) return;
      const img = document.getElementById('imgPreview');
      img.src = URL.createObjectURL(file);
      img.style.display = 'block';
    }

    async function postCard() {
      const name = document.getElementById('cardName').value.trim();
      const msg = document.getElementById('postMsg');
      if (!name) { showMsg(msg,'error','Card name is required.'); return; }
      showMsg(msg,'loading','⏳ Posting...');

      let imageUrl = null;
      const file = document.getElementById('cardImage').files[0];
      if (file) {
        const ext = file.name.split('.').pop();
        const filename = `card-${currentUser.id}-${Date.now()}.${ext}`;
        const { error: upErr } = await sb.storage.from('card-images').upload(filename, file, { contentType: file.type });
        if (upErr) { showMsg(msg,'error','Image upload failed: '+upErr.message); return; }
        imageUrl = sb.storage.from('card-images').getPublicUrl(filename).data.publicUrl;
      }

      const meta = currentUser.user_metadata || {};
      const { error } = await sb.from('card_listings').insert({
        poster_user_id: currentUser.id,
        poster_name: meta.full_name || currentUser.email,
        card_name: name,
        description: document.getElementById('description').value.trim() || null,
        min_price: parseFloat(document.getElementById('minPrice').value) || null,
        card_image_url: imageUrl,
        status: 'active'
      });
      if (error) { showMsg(msg,'error',error.message); return; }
      showMsg(msg,'success','✅ Card posted!');
      document.getElementById('cardName').value='';
      document.getElementById('minPrice').value='';
      document.getElementById('description').value='';
      document.getElementById('cardImage').value='';
      document.getElementById('imgPreview').style.display='none';
      loadMyListings();
    }

    async function loadMyListings() {
      const { data } = await sb.from('card_listings').select('*').eq('poster_user_id', currentUser.id).order('created_at',{ascending:false});
      const el = document.getElementById('myListings');
      if (!data || !data.length) { el.innerHTML='<p class="empty">No cards posted yet.</p>'; return; }
      el.innerHTML = data.map(l => listingHTML(l)).join('');
      data.forEach(l => loadOffersForListing(l.id));
    }

    function listingHTML(l) {
      const thumb = l.card_image_url
        ? `<div class="listing-thumb"><img src="${esc(l.card_image_url)}" /></div>`
        : `<div class="listing-thumb">🃏</div>`;
      const minPrice = l.min_price ? ` · Min $${Number(l.min_price).toFixed(2)}` : '';
      return `<div class="listing-card" id="listing-${l.id}">
        <div class="listing-header">
          ${thumb}
          <div class="listing-info">
            <p class="listing-name">${esc(l.card_name)}</p>
            <p class="listing-meta">${esc(l.description||'')}${minPrice}</p>
          </div>
          <button class="delete-btn" onclick="deleteListing('${l.id}')">✕ Remove</button>
        </div>
        <p class="offers-label">Offers received:</p>
        <input class="search-offers" type="text" placeholder="Search offers (cards, money...)" oninput="filterOffers('${l.id}',this.value)" />
        <div id="offers-${l.id}"><p class="empty">Loading...</p></div>
      </div>`;
    }

    async function loadOffersForListing(listingId) {
      const { data } = await sb.from('card_offers').select('*').eq('listing_id', listingId).order('created_at',{ascending:false});
      const offers = data || [];
      offerSearches[listingId] = offers;
      renderOffers(listingId, offers);
    }

    function filterOffers(listingId, q) {
      const all = offerSearches[listingId] || [];
      const filtered = q ? all.filter(o =>
        (o.offer_cards||'').toLowerCase().includes(q.toLowerCase()) ||
        String(o.offer_money||'').includes(q)
      ) : all;
      renderOffers(listingId, filtered);
    }

    function renderOffers(listingId, offers) {
      const el = document.getElementById('offers-'+listingId);
      if (!el) return;
      if (!offers.length) { el.innerHTML='<p class="empty">No offers yet.</p>'; return; }
      el.innerHTML = offers.map(o => {
        const money = o.offer_money ? `💰 $${Number(o.offer_money).toFixed(2)}` : '';
        const cards = o.offer_cards ? `🃏 ${esc(o.offer_cards)}` : '';
        const what = [money,cards].filter(Boolean).join(' · ');
        if (o.status === 'accepted') {
          const meetingInfo = o.meeting_datetime
            ? `<p style="font-size:0.78rem;color:#27ae60;margin-top:3px;">📍 ${esc(o.meeting_location||'TBD')} · 🕐 ${esc(o.meeting_datetime)}</p>`
            : '';
          const meetingStatus = o.meeting_status === 'confirmed'
            ? `<span style="font-size:0.78rem;color:#27ae60;font-weight:700;">✅ Time confirmed!</span>`
            : o.meeting_proposed_by === 'offerer'
              ? `<button class="accept-btn" onclick="acceptMeetingTime('${o.id}')">✅ Accept Their Time</button>
                 <button class="reject-btn" onclick="openMeetingModal('${o.id}','${listingId}')">🕐 Propose New</button>`
              : `<span style="font-size:0.78rem;color:#aaa;">⏳ Waiting for them to confirm...</span>`;
          return `<div class="offer-row" style="flex-direction:column;align-items:flex-start;gap:6px;">
            <div style="display:flex;align-items:center;gap:8px;width:100%;">
              <div class="offer-what"><strong>${esc(o.offerer_name||'Someone')}</strong>: ${what}</div>
              <div class="meetup-banner" style="margin:0;padding:6px 12px;flex:1;"><p>🤝 Bring your cards to each other!</p></div>
            </div>
            ${meetingInfo}
            <div style="display:flex;gap:8px;flex-wrap:wrap;">${meetingStatus}</div>
          </div>`;
        }
        const btns = o.status === 'pending'
          ? `<button class="accept-btn" onclick="openMeetingModal('${o.id}','${listingId}')">✅ Accept</button>
             <button class="reject-btn" onclick="respondOffer('${o.id}','${listingId}','rejected')">✕ Reject</button>`
          : `<span style="font-size:0.78rem;color:#c0392b;">✕ Rejected</span>`;
        return `<div class="offer-row">
          <div class="offer-what"><strong>${esc(o.offerer_name||'Someone')}</strong>: ${what||'(no details)'}</div>
          ${btns}
        </div>`;
      }).join('');
    }

    async function respondOffer(offerId, listingId, status) {
      await sb.from('card_offers').update({ status }).eq('id', offerId);
      if (status === 'accepted') {
        await sb.from('card_listings').update({ status: 'completed' }).eq('id', listingId);
      }
      loadOffersForListing(listingId);
      if (status === 'accepted') loadMyListings();
    }

    let pendingMeetingOfferId = null, pendingMeetingListingId = null;

    function openMeetingModal(offerId, listingId) {
      pendingMeetingOfferId = offerId;
      pendingMeetingListingId = listingId;
      document.getElementById('meetingLocation').value = '';
      document.getElementById('meetingDatetime').value = '';
      document.getElementById('meetingMsg').textContent = '';
      document.getElementById('meetingModalBg').style.display = 'flex';
    }

    function closeMeetingModal() {
      document.getElementById('meetingModalBg').style.display = 'none';
    }

    async function confirmMeeting() {
      const loc = document.getElementById('meetingLocation').value.trim();
      const dt  = document.getElementById('meetingDatetime').value;
      if (!loc || !dt) { document.getElementById('meetingMsg').textContent = 'Please fill in both fields.'; return; }
      const btn = document.getElementById('meetingConfirmBtn');
      btn.disabled = true; btn.textContent = 'Sending...';
      const dtFormatted = new Date(dt).toLocaleString();
      await sb.from('card_offers').update({
        status: 'accepted',
        meeting_location: loc,
        meeting_datetime: dtFormatted,
        meeting_proposed_by: 'poster',
        meeting_status: 'pending'
      }).eq('id', pendingMeetingOfferId);
      await sb.from('card_listings').update({ status: 'completed' }).eq('id', pendingMeetingListingId);
      btn.disabled = false; btn.textContent = 'Send ✉️';
      closeMeetingModal();
      loadMyListings();
    }

    async function acceptMeetingTime(offerId) {
      await sb.from('card_offers').update({ meeting_status: 'confirmed' }).eq('id', offerId);
      loadMyListings();
    }

    async function deleteListing(id) {
      if (!confirm('Remove this card listing?')) return;
      await sb.from('card_listings').delete().eq('id', id);
      loadMyListings();
    }

    function showMsg(el, type, text) {
      el.className='msg '+type; el.textContent=text; el.style.display='block';
      if (type!=='loading') setTimeout(()=>el.style.display='none', 3000);
    }

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    init();
  </script>
</body>
</html>
